name: Build standalone binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Vendor Cargo dependencies
        shell: bash
        run: |
          mkdir -p .cargo
          cargo vendor vendor > .cargo/config.toml
          tar -czf cargo-vendor.tar.gz vendor .cargo/config.toml Cargo.lock

      - name: Upload vendored dependencies
        uses: actions/upload-artifact@v4
        with:
          name: cargo-vendor-linux
          path: cargo-vendor.tar.gz
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: video-manager-egui-linux-x86_64
            binary: target/release/video-manager-egui
          - os: windows-2025
            artifact: video-manager-egui-windows-x86_64
            binary: target/release/video-manager-egui.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev \
            libdbus-1-dev libssl-dev pkg-config

      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
